# Vigilante de XAU/USD en la nube — SIN Render, SIN tarjeta.
#
# GitHub ejecuta este trabajo cada ~15 minutos, revisa el mercado del oro y te
# avisa por Telegram cuándo entrar y cuándo salir (2–4 señales/día). El estado
# (operaciones abiertas y contador diario) se guarda en el propio repo para que
# las salidas se sigan entre ejecuciones.
#
# PUESTA EN MARCHA (una sola vez):
#   1. En GitHub: Settings → Secrets and variables → Actions → New repository
#      secret, y crea los de tu canal de aviso. Para EMAIL:
#        ORO_SMTP_HOST     (p. ej. smtp.gmail.com)
#        ORO_SMTP_USUARIO  (tu correo)
#        ORO_SMTP_CLAVE    (contraseña de aplicación de Gmail, requiere 2FA)
#        ORO_SMTP_DESTINO  (tu correo)
#      Para TELEGRAM: ORO_TELEGRAM_TOKEN y ORO_TELEGRAM_CHAT_ID.
#      (Sin secretos el trabajo funciona igual, pero no envía nada: solo deja el
#       aviso en el registro de la ejecución.)
#   2. Settings → Actions → General → asegúrate de que Actions está habilitado.
#   3. Prueba: Actions → «Alertas XAU/USD» → Run workflow → marca modo_prueba.
#
# (Este workflow ya está en la rama por defecto de este repo, así que la tarea
#  programada se ejecuta sola; no hay que fusionar nada.)
#
# Notas honestas:
#   - GitHub puede retrasar las tareas programadas varios minutos si hay carga.
#   - Si el repo queda 60 días sin actividad, GitHub pausa las tareas
#     programadas (basta con volver a activarlas o hacer un commit).

name: Alertas XAU/USD

on:
  schedule:
    # Cada 15 min GitHub encola un arranque; como cada ejecución mantiene una
    # ventana de vigilancia de ~50 min (revisando en vivo cada 3 min), en la
    # práctica hay cobertura casi continua y se reducen los arranques cancelados
    # que provoca el estrangulamiento de las tareas gratuitas con */5.
    - cron: "*/15 * * * *"
  workflow_dispatch:            # permite lanzarlo a mano desde la pestaña Actions.
    inputs:
      modo_prueba:
        description: "Enviar una notificación de PRUEBA (para comprobar el email/Telegram)"
        type: boolean
        default: false

permissions:
  contents: write              # para guardar el estado (oro_estado.json) en el repo.

concurrency:
  group: oro-alertas
  cancel-in-progress: false    # no solapar ejecuciones.

jobs:
  revisar:
    runs-on: ubuntu-latest
    # La ventana de vigilancia dura ~50 min; este tope evita que un ciclo colgado
    # deje la máquina ocupada. Debe superar ORO_BUCLE_MINUTOS con margen.
    timeout-minutes: 58
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r oro/requirements-web.txt

      - name: Revisar el mercado y notificar
        env:
          # Telegram (recomendado). Deja en blanco los que no uses.
          ORO_TELEGRAM_TOKEN: ${{ secrets.ORO_TELEGRAM_TOKEN }}
          ORO_TELEGRAM_CHAT_ID: ${{ secrets.ORO_TELEGRAM_CHAT_ID }}
          # Email (alternativa: todo el mundo tiene correo). Ver oro/notificaciones.
          ORO_SMTP_HOST: ${{ secrets.ORO_SMTP_HOST }}
          ORO_SMTP_USUARIO: ${{ secrets.ORO_SMTP_USUARIO }}
          ORO_SMTP_CLAVE: ${{ secrets.ORO_SMTP_CLAVE }}
          ORO_SMTP_DESTINO: ${{ secrets.ORO_SMTP_DESTINO }}
          # Webhook genérico (push/WhatsApp API/Slack…), opcional.
          ORO_WEBHOOK_URL: ${{ secrets.ORO_WEBHOOK_URL }}
          # Ajuste de FRECUENCIA/CALIDAD (opcional), desde la pestaña «Variables»
          # de Actions (no son secretos). Vacío = valores por defecto del código.
          # Bajar estos umbrales = más señales, algo menos de calidad media.
          # Subirlos = menos señales, más selectivo.
          ORO_PUNTUACION_MINIMA: ${{ vars.ORO_PUNTUACION_MINIMA }}
          ORO_PROB_MINIMA: ${{ vars.ORO_PROB_MINIMA }}
          ORO_CONFIANZA_MINIMA: ${{ vars.ORO_CONFIANZA_MINIMA }}
          ORO_OPERACIONES_MAX_DIA: ${{ vars.ORO_OPERACIONES_MAX_DIA }}
          # Ventana de vigilancia: cuánto tiempo se mantiene vivo el runner y cada
          # cuánto revisa el mercado con el precio EN VIVO (para avisar de las
          # salidas a tiempo). Ajustables desde «Variables» de Actions.
          ORO_BUCLE_MINUTOS: ${{ vars.ORO_BUCLE_MINUTOS }}
          ORO_BUCLE_CADA_SEG: ${{ vars.ORO_BUCLE_CADA_SEG }}
        run: |
          if [ "${{ inputs.modo_prueba }}" = "true" ]; then
            python -m oro.alerta --probar
          else
            # Mantiene el vigilante vivo ~50 min revisando cada 3 min (no depende
            # de que GitHub arranque la tarea cada pocos minutos). Guarda el estado
            # tras cada ciclo, así que el paso siguiente lo versiona igual.
            python -m oro.vigilar
          fi

      - name: Guardar el estado y el registro de operaciones
        run: |
          # Guardado a prueba de conflictos (ver oro/persistencia.py). El rebase
          # en shell que había aquí llegó a PERDER una operación abierta: chocó,
          # abortó y el fallo se tragaba con un echo.
          python -m oro.persistencia
