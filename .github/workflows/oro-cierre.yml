# Cierre garantizado de fin de sesión (XAU/USD).
#
# Existe porque el aviso de "sal de la operación" NO puede depender de que justo
# a esa hora haya una ventana de vigilancia viva. Las ventanas duran ~50 min y
# GitHub las encola y cancela a su antojo: puede no haber ninguna corriendo al
# cierre, y entonces la operación se quedaría abierta de un día para otro —justo
# lo que el modo intradía debe impedir—.
#
# Es un trabajo CORTO e independiente (arranca en segundos), así que no compite
# con la ventana larga ni se queda encolado detrás de ella.
#
# Se ejecuta dos veces por seguridad: si la primera no consigue máquina, la
# segunda lo cubre. Ambas con margen ANTES del cierre del mercado (21:00 UTC),
# para que dé tiempo a cerrar en el bróker.

name: Cierre de sesión XAU/USD

on:
  schedule:
    # Objetivo: avisar a las 21:50 de la hora del usuario, ~70 min antes de que
    # el mercado cierre (23:00 en Madrid todo el año). El cron va en UTC y no
    # conoce el cambio de hora, así que hay un par de citas para el horario de
    # verano y otro para el de invierno; el propio programa comprueba la hora
    # LOCAL (--si-toca) y solo actúa en la franja correcta. La segunda cita de
    # cada par es la red de seguridad por si GitHub retrasa la primera.
    - cron: "50 19 * * 1-5"   # 21:50 en Madrid (verano)
    - cron: "58 19 * * 1-5"   # red de seguridad (verano)
    - cron: "50 20 * * 1-5"   # 21:50 en Madrid (invierno)
    - cron: "58 20 * * 1-5"   # red de seguridad (invierno)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: oro-cierre           # nunca dos cierres a la vez.
  cancel-in-progress: false

jobs:
  cerrar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Instalar dependencias
        run: pip install -r oro/requirements-web.txt
      - name: Cerrar lo que quede abierto y avisar
        env:
          ORO_SMTP_HOST: ${{ secrets.ORO_SMTP_HOST }}
          ORO_SMTP_USUARIO: ${{ secrets.ORO_SMTP_USUARIO }}
          ORO_SMTP_CLAVE: ${{ secrets.ORO_SMTP_CLAVE }}
          ORO_SMTP_DESTINO: ${{ secrets.ORO_SMTP_DESTINO }}
          ORO_TELEGRAM_TOKEN: ${{ secrets.ORO_TELEGRAM_TOKEN }}
          ORO_TELEGRAM_CHAT_ID: ${{ secrets.ORO_TELEGRAM_CHAT_ID }}
        run: python -m oro.cierre --si-toca
      - name: Guardar el estado y el registro de operaciones
        run: |
          # Guardado a prueba de conflictos (ver oro/persistencia.py). El rebase
          # en shell que había aquí llegó a PERDER una operación abierta: chocó,
          # abortó y el fallo se tragaba con un echo.
          python -m oro.persistencia
