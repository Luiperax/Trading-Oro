# Parte diario del vigilante XAU/USD.
#
# Manda un correo al día contando si el sistema está vivo, qué ha hecho, si hay
# alguna operación abierta y —cuando no hay señales— POR QUÉ no las hay.
#
# Existe por un motivo concreto: el sistema puede pasar días sin señal porque sus
# filtros son muy selectivos y el oro está en rango. Ese silencio, desde fuera,
# es idéntico a una avería. Este parte elimina esa duda.

name: Parte diario XAU/USD

on:
  schedule:
    # Objetivo: que llegue a las 7:00 de la mañana en Madrid, con el café.
    # Dos complicaciones reales: el cron va en UTC y NO conoce el cambio de hora
    # (las 7:00 de Madrid son las 05:00 UTC en verano y las 06:00 en invierno),
    # y GitHub retrasa las tareas de forma muy irregular (medido: de 30 min a
    # 8 h). Por eso hay varias citas por la mañana: el propio programa decide si
    # toca (--si-toca) mirando la hora LOCAL y una marca con la última sesión ya
    # informada, así que se envía una sola vez y lo antes posible a partir de
    # las 7:00. De martes a sábado: cada parte resume la sesión de la víspera.
    - cron: "3 5 * * 2-6"     # 07:00 en Madrid (verano)
    - cron: "33 5 * * 2-6"
    - cron: "3 6 * * 2-6"     # 07:00 en Madrid (invierno)
    - cron: "33 6 * * 2-6"
    - cron: "33 7 * * 2-6"    # red de seguridad: GitHub retrasa mucho y de
    - cron: "33 8 * * 2-6"    # forma irregular, así que se reparten varias
    - cron: "33 9 * * 2-6"    # citas por la mañana. La marca impide que se
    - cron: "33 10 * * 2-6"   # envíe más de una vez, y el propio programa
    - cron: "33 11 * * 2-6"   # descarta las que caigan fuera de la mañana.
  workflow_dispatch: {}

# Nunca dos partes a la vez: la marca se escribe DESPUÉS de enviar, así que
# dos citas solapadas leerían la marca vieja y mandarían dos correos.
concurrency:
  group: oro-latido
  cancel-in-progress: false

permissions:
  contents: write             # para anotar qué sesión ya se informó.

jobs:
  parte:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Instalar dependencias
        run: pip install -r oro/requirements-web.txt
      - name: Enviar el parte diario
        env:
          ORO_SMTP_HOST: ${{ secrets.ORO_SMTP_HOST }}
          ORO_SMTP_USUARIO: ${{ secrets.ORO_SMTP_USUARIO }}
          ORO_SMTP_CLAVE: ${{ secrets.ORO_SMTP_CLAVE }}
          ORO_SMTP_DESTINO: ${{ secrets.ORO_SMTP_DESTINO }}
          ORO_TELEGRAM_TOKEN: ${{ secrets.ORO_TELEGRAM_TOKEN }}
          ORO_TELEGRAM_CHAT_ID: ${{ secrets.ORO_TELEGRAM_CHAT_ID }}
        run: python -m oro.latido --si-toca
