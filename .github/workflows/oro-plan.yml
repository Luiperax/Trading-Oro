# Plan del día de XAU/USD — ruptura del rango de la mañana de Londres.
#
# A las 8:00 de Nueva York (14:00 en Madrid casi todo el año) mide el rango que
# ha dejado la mañana de Londres y te manda un correo con DOS órdenes pendientes:
# una compra por encima del máximo y una venta por debajo del mínimo. Dejas las
# dos puestas en el bróker y te olvidas: la que salte es la operación del día.
#
# Es una estrategia SEPARADA del vigilante intradía (oro-alertas.yml) y no
# interfiere con él. Lo que se midió, lo que sobrevivió y lo que falló está
# documentado en oro/sesiones.py.
#
# IMPORTANTE: el plan NO se envía si tu spread (ORO_COSTE_OPERACION) supera
# 0.60 $/oz, porque por encima de eso la ventaja medida es NEGATIVA. Si no
# recibes correos y el registro dice "supera el máximo al que esta estrategia
# gana", el sistema está funcionando: te está diciendo que con tu cuenta actual
# esto pierde dinero. Ver docs/CAMBIAR_DE_CUENTA.md.
#
# Para apagarlo sin tocar código: Variables de Actions -> ORO_RUPTURA_ACTIVA=0.

name: Plan del día XAU/USD

on:
  schedule:
    # Las 8:00 de Nueva York son las 12:00 UTC en verano y las 13:00 en invierno.
    # Se programan las dos y el propio código comprueba la hora del MERCADO: la
    # que no toca sale sin hacer nada. Es la forma limpia de que el cambio de
    # horario no descoloque el plan dos veces al año.
    #
    # La tercera existe para tener SIEMPRE un segundo intento: el plan sirve
    # durante toda la ventana de disparo (8:00-10:00 de Nueva York), así que si
    # el primer arranque falla —GitHub retrasa la cola, el SMTP da error— el
    # siguiente lo reintenta. Y si el primero ya lo envió, el segundo no manda
    # nada: `oro_plan.json` recuerda el día.
    #   verano   12:00 UTC = 8 ET (envía) · 13:00 = 9 ET (reintento) · 14:00 = 10 ET (fuera)
    #   invierno 12:00 UTC = 7 ET (fuera) · 13:00 = 8 ET (envía)     · 14:00 = 9 ET (reintento)
    - cron: "0 12 * * 1-5"
    - cron: "0 13 * * 1-5"
    - cron: "0 14 * * 1-5"
  workflow_dispatch:
    inputs:
      forzar:
        description: "Enviar el plan aunque no sea la hora (para probarlo)"
        type: boolean
        default: false

permissions:
  contents: write              # para recordar el último plan enviado (oro_plan.json).

concurrency:
  group: oro-plan
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r oro/requirements-web.txt

      - name: Calcular y enviar el plan
        env:
          ORO_TELEGRAM_TOKEN: ${{ secrets.ORO_TELEGRAM_TOKEN }}
          ORO_TELEGRAM_CHAT_ID: ${{ secrets.ORO_TELEGRAM_CHAT_ID }}
          ORO_SMTP_HOST: ${{ secrets.ORO_SMTP_HOST }}
          ORO_SMTP_USUARIO: ${{ secrets.ORO_SMTP_USUARIO }}
          ORO_SMTP_CLAVE: ${{ secrets.ORO_SMTP_CLAVE }}
          ORO_SMTP_DESTINO: ${{ secrets.ORO_SMTP_DESTINO }}
          ORO_WEBHOOK_URL: ${{ secrets.ORO_WEBHOOK_URL }}
          # El más importante: tu spread real en $/oz por operación completa.
          # De él depende que este plan se envíe o no.
          ORO_COSTE_OPERACION: ${{ vars.ORO_COSTE_OPERACION }}
          ORO_CAPITAL: ${{ vars.ORO_CAPITAL }}
          ORO_RIESGO_POR_OPERACION: ${{ vars.ORO_RIESGO_POR_OPERACION }}
          ORO_TIMEFRAME: ${{ vars.ORO_TIMEFRAME }}
          ORO_SIMBOLO: ${{ vars.ORO_SIMBOLO }}
          ORO_ZONA_HORARIA: ${{ vars.ORO_ZONA_HORARIA }}
          ORO_SMTP_PUERTO: ${{ vars.ORO_SMTP_PUERTO }}
          # Parámetros de esta estrategia (vacío = valores medidos por defecto).
          ORO_RUPTURA_ACTIVA: ${{ vars.ORO_RUPTURA_ACTIVA }}
          ORO_RUPTURA_R_OBJETIVO: ${{ vars.ORO_RUPTURA_R_OBJETIVO }}
          ORO_RUPTURA_COSTE_MAX: ${{ vars.ORO_RUPTURA_COSTE_MAX }}
          ORO_RUPTURA_HORAS_VALIDEZ: ${{ vars.ORO_RUPTURA_HORAS_VALIDEZ }}
          ORO_RUPTURA_SESGO_CUERPO_MINIMO: ${{ vars.ORO_RUPTURA_SESGO_CUERPO_MINIMO }}
        run: |
          if [ "${{ inputs.forzar }}" = "true" ]; then
            python -m oro.plan_sesion --forzar
          else
            python -m oro.plan_sesion
          fi

      - name: Recordar que el plan de hoy ya se envió
        # Sin esto, cada arranque volvería a mandar el mismo correo. Se guarda con
        # la misma estrategia a prueba de conflictos que el resto del estado.
        run: |
          python - <<'PY'
          from oro.persistencia import guardar_ficheros
          # El estado lleva ahora el PLAN entero, que es lo que el trabajo de
          # seguimiento necesita para seguir la operación por la tarde.
          guardar_ficheros(["oro_plan.json"], "Plan de ruptura enviado [skip ci]")
          PY
